---
# Restrict the Cilium Gateway API listeners on the control-plane nodes to
# the edge HAProxy.
#
# Cilium's gatewayAPI.enableProxyProtocol installs Envoy's PROXY-protocol
# listener filter with allow_requests_without_proxy_protocol unset (false),
# so connections without a PROXY header are rejected. The PROXY header is
# unauthenticated: anyone able to reach a node's :80/:443 could forge an
# arbitrary client address into the access log. Only the edge may connect.
#
# Rules live in a dedicated chain jumped to from INPUT, so the rest of the
# node's INPUT chain stays untouched and the whole rule set is removable
# by deleting one chain.
#
# Note: the Kubernetes API port (6443) is deliberately not touched.

- name: Configure the Gateway listener firewall
  when: gateway_proxy_protocol | bool
  block:
    - name: Preseed iptables-persistent to save current rules on install (non-interactive)
      ansible.builtin.debconf:
        name: "iptables-persistent"
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: "iptables-persistent/autosave_v4", value: "true", vtype: "boolean" }
        - { question: "iptables-persistent/autosave_v6", value: "false", vtype: "boolean" }

    # chain_management is what actually runs `iptables -N`. Without it the
    # module only reports that the chain is missing and creates nothing.
    - name: Create the {{ gateway_firewall_chain }} chain
      ansible.builtin.iptables:
        chain: "{{ gateway_firewall_chain }}"
        chain_management: true
        state: present

    - name: Jump to the {{ gateway_firewall_chain }} chain from INPUT
      ansible.builtin.iptables:
        chain: INPUT
        jump: "{{ gateway_firewall_chain }}"
        action: insert
        rule_num: "1"
        comment: "k8s-lab: Gateway listener access control"

    # Cilium re-inserts its own CILIUM_INPUT jump at position 1 of INPUT
    # every time the agent restarts, which pushes K8SGW further down the
    # chain. CILIUM_INPUT ACCEPTs traffic marked 0x200 (Cilium-proxied
    # traffic) — in-cluster traffic that reaches the Gateway over that path
    # would then never reach the K8SGW DROP rules and could smuggle its own
    # PROXY header, forging a client IP. So K8SGW has to be first, and the
    # position is re-asserted on every run instead of trusted.
    - name: Ensure the {{ gateway_firewall_chain }} jump is the first rule in INPUT
      ansible.builtin.shell:
        cmd: |
          set -e
          if iptables -t filter -S INPUT | sed -n '2p' | grep -q -- '-j {{ gateway_firewall_chain }}'; then
            echo "JUMP_FIRST_OK"
          else
            iptables -t filter -D INPUT -j {{ gateway_firewall_chain }} \
              -m comment --comment "k8s-lab: Gateway listener access control" || true
            iptables -t filter -I INPUT 1 -j {{ gateway_firewall_chain }} \
              -m comment --comment "k8s-lab: Gateway listener access control"
            echo "JUMP_REMOVED"
          fi
        executable: /bin/bash
      register: gateway_firewall_jump_position
      changed_when: "'JUMP_REMOVED' in gateway_firewall_jump_position.stdout"

    - name: Allow the edge HAProxy to reach the Gateway listeners
      ansible.builtin.iptables:
        chain: "{{ gateway_firewall_chain }}"
        source: "{{ gateway_firewall_edge_ip }}"
        protocol: tcp
        destination_port: "{{ item }}"
        jump: ACCEPT
        comment: "k8s-lab: edge HAProxy -> Gateway listener"
      loop: "{{ gateway_firewall_listener_ports }}"

    # Loopback to the Gateway listeners is a PROXY-header forgery path:
    # loopback traffic reaches Envoy's PROXY filter, and the header is
    # unauthenticated, so ANY local user on the node (no root required)
    # can write an arbitrary client IP into the access log. Measured
    # 2026-11-02 on node-02: a forged PROXY header over 127.0.0.1 was
    # logged by Envoy as "remote_address":"203.0.113.99".
    #
    # Nothing legitimate uses it (loopback counters sat at 0 packets on
    # node-03 while 31490 edge packets passed), so it is off by default
    # and the rule is actively REMOVED when it is off — otherwise the
    # forge path would survive on every node that was configured before.
    - name: Allow the node itself to reach the Gateway listeners
      ansible.builtin.iptables:
        chain: "{{ gateway_firewall_chain }}"
        source: "127.0.0.1"
        protocol: tcp
        destination_port: "{{ item }}"
        jump: ACCEPT
        comment: "k8s-lab: loopback -> Gateway listener"
        state: "{{ 'present' if gateway_firewall_allow_loopback | bool else 'absent' }}"
      loop: "{{ gateway_firewall_listener_ports }}"

    - name: Drop every other connection to the Gateway listeners
      ansible.builtin.iptables:
        chain: "{{ gateway_firewall_chain }}"
        protocol: tcp
        destination_port: "{{ item }}"
        jump: DROP
        comment: "k8s-lab: PROXY protocol is unauthenticated - edge only"
      loop: "{{ gateway_firewall_listener_ports }}"

    - name: Drop the Gateway Service NodePorts
      ansible.builtin.iptables:
        chain: "{{ gateway_firewall_chain }}"
        protocol: tcp
        destination_port: "{{ item }}"
        jump: DROP
        comment: "k8s-lab: NodePort path to the PROXY-required listener"
      loop: "{{ gateway_firewall_nodeports }}"

    - name: Install iptables-persistent
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true
        cache_valid_time: 3600
      environment:
        DEBIAN_FRONTEND: noninteractive

    # The forge path must stay closed. Assert it rather than trusting that
    # the rule above was applied — the whole point of the loopback rule
    # was that it looked harmless.
    #
    # The pattern matches ANY rule whose source is a loopback address
    # (127.0.0.0/8 in any prefix length) and whose target is ACCEPT, so a
    # future rule written as `-s 127.0.0.0/8` cannot slip past the check.
    - name: Assert that no loopback exception survived in the chain
      ansible.builtin.shell:
        cmd: >-
          iptables -t filter -S {{ gateway_firewall_chain }}
          | grep -E -- '-s 127\.[0-9.]+/[0-9]+ .*-j ACCEPT' | wc -l
        executable: /bin/bash
      register: loopback_accepts
      changed_when: false

    - name: Fail when the chain still accepts loopback traffic
      ansible.builtin.fail:
        msg: >-
          {{ gateway_firewall_chain }} still has a loopback ACCEPT rule.
          Any local user on this node can forge a client IP in the Gateway
          access log through it.
      when: (loopback_accepts.stdout | int) > 0

    - name: Persist iptables rules across reboot
      ansible.builtin.command:
        cmd: netfilter-persistent save
      changed_when: true
