---
haproxy_package: haproxy
haproxy_kube_api_port: 6443
haproxy_http_port: 80
haproxy_https_port: 443
haproxy_stats_port: 8404
haproxy_config_path: /etc/haproxy/haproxy.cfg
# Minimum acceptable haproxy version. Anything already installed at or above
# this is kept as-is (Ubuntu ships `haproxy-awslc`, which conflicts with the
# PPA package over /usr/sbin/haproxy).
haproxy_min_version: "3.2"
# Used only when the PPA install path is taken.
haproxy_apt_package: haproxy
haproxy_apt_version: "3.2.*"
