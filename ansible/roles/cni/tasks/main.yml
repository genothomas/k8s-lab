---
- name: Download Helm tarball
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: /tmp/helm.tar.gz
    mode: "0644"
  when: not ansible_check_mode

- name: Extract Helm binary
  ansible.builtin.unarchive:
    src: /tmp/helm.tar.gz
    dest: /usr/local/bin
    remote_src: true
    creates: /usr/local/bin/helm
    extra_opts:
      - --strip-components=1
      - --no-same-owner
    include:
      - "linux-amd64/helm"
  when: not ansible_check_mode

- name: Add Cilium Helm repo
  ansible.builtin.command:
    cmd: helm repo add {{ cilium_chart_repo }} {{ cilium_chart_url }}
  register: helm_repo_add
  changed_when: "'has been added' in helm_repo_add.stdout"
  when: not ansible_check_mode

- name: Update Helm repos
  ansible.builtin.command: helm repo update
  changed_when: false
  when: not ansible_check_mode

- name: Render Cilium chart overrides
  ansible.builtin.template:
    src: cilium-overrides.yaml.j2
    dest: /tmp/cilium-overrides.yaml
    mode: "0644"

- name: Install Cilium CNI
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install {{ cilium_chart_repo }} {{ cilium_chart_name }}
      --version {{ cilium_version }}
      --namespace {{ cilium_namespace }}
      --kubeconfig=/etc/kubernetes/admin.conf
      --set kubeProxyReplacement={{ cilium_kube_proxy_replacement }}
      --set k8sServiceHost={{ cilium_k8s_service_host }}
      --set k8sServicePort={{ cilium_k8s_service_port }}
      --set ipam.mode={{ cilium_ipam_mode }}
      --set hubble.enabled={{ cilium_hubble_enabled }}
      --set gatewayAPI.enabled={{ cilium_gateway_api_enabled }}
      -f /tmp/cilium-overrides.yaml
      --wait --timeout 10m
  register: cilium_install
  changed_when: "'STATUS: deployed' in cilium_install.stdout"
  when: not ansible_check_mode

- name: Wait for Cilium DaemonSet to be Ready
  ansible.builtin.command:
    cmd: kubectl -n {{ cilium_namespace }} rollout status ds/{{ cilium_chart_repo }} --kubeconfig=/etc/kubernetes/admin.conf --timeout=300s
  register: cilium_rollout
  changed_when: false
  when: not ansible_check_mode
