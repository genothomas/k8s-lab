---
kubernetes_version: "1.36.5"
kubernetes_patch_version: "1.36"

# cri-tools version (provides crictl, the CRI client for containerd).
# Tracks the Kubernetes minor: cri-tools 1.36.0 pairs with k8s 1.36.
kubernetes_cri_tools_version: "{{ kubernetes_patch_version }}.0"

container_runtime: containerd

# External API endpoint fronted by HAProxy. Added to apiserver cert SANs.
kubernetes_api_endpoint: "{{ edge_public_ip }}:6443"

# In-cluster endpoint — private IP of first control plane. Avoids hairpin
# route edge-01 (NAT) → haproxy → node-01:6443 that times out kubeadm
# upload-certs ClusterRoleBinding POST (10s).
kubernetes_control_plane_endpoint: "{{ node_01_private_ip }}:6443"

haproxy_kube_api_port: 6443
haproxy_http_port: 80
haproxy_https_port: 443
haproxy_stats_port: 8404

# PROXY protocol v2 between the edge HAProxy and the Cilium Gateway API
# listeners. Cilium's gatewayAPI.enableProxyProtocol is operator-GLOBAL:
# once enabled, every Gateway listener rejects connections without a PROXY
# header, so ClusterIP / NodePort / direct-node access to the Gateway all
# stop working. The edge HAProxy is the only supported ingress.
#
# Rollback: set this to false and re-run
#   ansible/playbooks/gateway-proxy-protocol.yml
# Both sides flip back together (HAProxy drops send-proxy-v2, Cilium drops
# the listener filter).
gateway_proxy_protocol: true

# Network ranges sourced from terraform via inventory all.vars.

common_packages:
  - curl
  - ca-certificates
  - gnupg
  - apt-transport-https
  - chrony
  - software-properties-common

kubernetes_sysctl:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1

kubernetes_kernel_modules:
  - overlay
  - br_netfilter

# ntfy topic includes env + name so dev/staging/prod route to own channels.
alertmanager_webhook_url: "https://ntfy.sh/{{ kubernetes_environment }}-{{ cluster_name }}"

# Grafana admin password. Read from the environment — the observability
# tier puts Grafana on the public https listener, so the credential must
# not live in the repo. The role fails fast when it is unset.
grafana_admin_password: "{{ lookup('env', 'GRAFANA_ADMIN_PASSWORD') | default('', true) }}"
