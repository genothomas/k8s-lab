apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: demo
  labels:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: podinfo
    app.kubernetes.io/part-of: demo
  ports:
    # The port MUST be named: the podinfo VMServiceScrape selects this
    # endpoint by Service port name ("port: http"), not by number. An
    # unnamed port makes the scrape find zero targets and fires
    # ScrapePoolHasNoTargets.
    - name: http
      protocol: TCP
      port: 80
      targetPort: http